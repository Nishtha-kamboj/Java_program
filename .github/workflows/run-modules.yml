name: Run Java Programs Daily

on:
  schedule:
    # Runs at 5 PM Toronto time (EST/EDT)
    # Toronto is UTC-5 (EST) or UTC-4 (EDT)
    # 5 PM Toronto = 10 PM UTC (EST) or 9 PM UTC (EDT)
    # Using 9 PM UTC (21:00) as it covers most of the year
    - cron: '0 21 * * *'
  
  # Allow manual trigger
  workflow_dispatch:

jobs:
  run-java-programs:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Set up JDK 11
        uses: actions/setup-java@v3
        with:
          java-version: '11'
          distribution: 'temurin'
      
      - name: Run Encapsulation module
        run: |
          cd modules/Encapsulation
          for file in *.java; do
            if [ -f "$file" ]; then
              echo "Compiling and running $file..."
              javac "$file"
              java "${file%.java}"
            fi
          done
      
      - name: Run Final_examples module
        run: |
          cd modules/Final_examples
          for file in *.java; do
            if [ -f "$file" ]; then
              echo "Compiling and running $file..."
              javac "$file"
              java "${file%.java}"
            fi
          done
      
      - name: Run Method_overloading module
        run: |
          cd modules/Method_overloading
          for file in *.java; do
            if [ -f "$file" ]; then
              echo "Compiling and running $file..."
              javac "$file"
              java "${file%.java}"
            fi
          done
      
      - name: Run Polymorphism module
        run: |
          cd modules/Polymorphism
          for file in *.java; do
            if [ -f "$file" ]; then
              echo "Compiling and running $file..."
              javac "$file"
              java "${file%.java}"
            fi
          done
      
      - name: Run RootProject module
        run: |
          cd modules/RootProject
          for file in *.java; do
            if [ -f "$file" ]; then
              echo "Compiling and running $file..."
              javac "$file"
              java "${file%.java}"
            fi
          done
